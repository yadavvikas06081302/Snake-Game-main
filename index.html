<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
       <section>
            <div class="infos">

                <div class="info">
                    <h3>High Score:
                        <span id="high-score">0</span>
                    </h3>
                </div>

                 <div class="info">
                    <h3>Score:
                        <span id="score">0</span>
                    </h3>
                </div>

                 <div class="info">
                    <h3>Time:
                        <span id="time">00-00</span>
                    </h3>
                </div>
            </div>
            <div class="board"> 
            </div>
       </section>
       <div class="modal">
        <div class="start-game">
            <h2>Welcome to the Snake Game</h2>
           <button id="start-btn" class="btn start-btn">Start Game</button>
        </div>
        <div class="game-over">
            <h3>Game Over</h3>
            <button class="btn restart-btn">Restart Game</button>
        </div>
       </div>
    </main>
    <script src="script.js"></script>
    <div class="mobile-controls">
    <button onclick="changeDirection('up')">⬆️</button>

    <div>
        <button onclick="changeDirection('left')">⬅️</button>
        <button onclick="changeDirection('down')">⬇️</button>
        <button onclick="changeDirection('right')">➡️</button>
    </div>
</div>
</body>
</html>
